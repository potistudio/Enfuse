[package]
name = "enfuse"
description = "Fuse them."
version = "0.0.1"
authors = ["potistudio <potistudio@proton.me>"]
license = "MIT"
publish = false
edition = "2024"

[dependencies]
iced = { version = "0.13.1", features = [
	"canvas",
	"image",
	"advanced",
	"tokio",
] }
rfd = "0.16.0"
rodio = "0.19.0"
symphonia = { version = "0.5.5", features = ["all"] }
tokio = { version = "1.48.0", features = ["full"] }
rayon = "1.10.0"
ringbuf = "0.4"
env_logger = "0.11.8"
log = "0.4.29"
rustfft = "6.4.1"
logger = "0.4.0"
midir = "0.11.0"
